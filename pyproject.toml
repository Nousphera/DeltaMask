[build-system]
requires = ["setuptools>=77", "wheel", "pybind11==3.0.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deltamask"
version = "0.1.0"
description = "DeltaMask stochastic mask learning and four-wise binary fuse transport"
readme = "README.md"
license-files = ["THIRD_PARTY_LICENSES"]
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "pillow>=11,<13", "torch==2.8.0", "torchvision==0.23.0", "flwr==1.40.0", "transformers==4.57.6", "timm==1.0.30"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
simulation = ["flwr[simulation]==1.40.0"]
vision = []  # Kept as a compatibility extra; native App dependencies include vision.

[project.scripts]
deltamask-train = "deltamask.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deltamask = ["native/*.cpp", "native/*.json", "native/fastfilter/*.h"]

[tool.setuptools.data-files]
"share/deltamask/configs" = ["configs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flwr.app]
publisher = "nousphera"

[tool.flwr.app.components]
serverapp = "deltamask.server_app:app"
clientapp = "deltamask.client_app:app"

[tool.flwr.app.config]
num-rounds = 2
num-clients = 2
participation = 1.0
local-epochs = 1
batch-size = 1
learning-rate = 0.1
probe-learning-rate = 0.1
kappa = 0.8
seed = 42
dataset = "cifar10"
model = "clip-vit-b32"
pretrained = true
torch-threads = 1
data-root = "data"
allow-download = false
alpha = 10.0
samples-per-client = 1
output = "results/flower.json"
device = "cpu"
model-revision = ""
model-checkpoint = ""
